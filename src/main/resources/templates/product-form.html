<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Product Form</title>
</head>
<body>

<h2>Product Form</h2>

<form
th:action="${product.id == null}
    ? @{/products/save}
    : @{/products/update/{id}(id=${product.id})}"
th:object="${product}"
method="post">

    <input type="hidden"
           th:field="*{id}">

    <div>

        <label>Name</label>

        <input type="text"
               th:field="*{name}">

    </div>

    <br>

    <div>

        <label>Description</label>

        <input type="text"
               th:field="*{description}">

    </div>

    <br>

    <div>

        <label>Price</label>

        <input type="number"
               step="0.01"
               th:field="*{price}">

    </div>

    <br>

    <div>

        <label>Stock Quantity</label>

        <input type="number"
               th:field="*{stockQuantity}">

    </div>

    <br>

    <button type="submit">
        Save Product
    </button>

</form>

<br>

<a th:href="@{/products}">
    Back
</a>

</body>
</html>
